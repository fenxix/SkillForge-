<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="220" fill="url(#glow)"/>

  <!-- Skill gem hexagon -->
  <polygon points="256,118 384,192 384,340 256,414 128,340 128,192" fill="url(#gem)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  <!-- top facet highlight -->
  <polygon points="256,118 384,192 256,236 128,192" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Stacked rank chevrons (level-up motif) -->
  <path d="M194,271 L256,221 L318,271" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M194,335 L256,285 L318,335" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Forge sparks -->
  <path d="M382,100 C386,114 389,117 403,121 C389,125 386,128 382,142 C378,128 375,125 361,121 C375,117 378,114 382,100 Z" fill="url(#spark)"/>
  <path d="M416,148 C418,155 420,157 427,159 C420,161 418,163 416,170 C414,163 412,161 405,159 C412,157 414,155 416,148 Z" fill="url(#spark)"/>
  <circle cx="398" cy="172" r="4.5" fill="#fbbf24"/>
</svg>
